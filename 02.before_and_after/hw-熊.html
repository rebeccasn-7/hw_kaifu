<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .body {
            width: 300px;
            height: 300px;
            background: black;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            position: absolute;
        }

        .body::before {
            content: "";
            width: 37px;
            height: 37px;
            background: white;
            border: 10px solid black;
            border-radius: 50%;
            top: 7%;
            left: 15%;
            transform: translate(-50%, -50%);
            position: absolute;
        }

        .body::after {
            content: "";
            width: 37px;
            height: 37px;
            background: white;
            border: 10px solid black;
            border-radius: 50%;
            top: 7%;
            left: 85%;
            transform: translate(-50%, -50%);
            position: absolute;
        }


        .eye-left {
            width: 45px;
            height: 45px;
            background: #000;
            border: 10px solid #fff;
            border-radius: 50%;
            top: 30%;
            left: 30%;
            transform: translate(-50%, -50%);
            position: absolute;

            z-index: 2;

        }


        .eye-right {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #000;
            border: 10px solid #fff;
            top: 30%;
            left: 70%;
            transform: translate(-50%, -50%);
            position: absolute;

            z-index: 3;
        }

        .nose {
            width: 130px;
            height: 90px;
            border-radius: 50%;
            background: white;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
        }

        .nose::before {
            content: "";
            width: 35px;
            height: 20px;
            border-radius: 50%;
            background: black;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
            z-index: 4;
        }

        .nose::after {
            content: "";
            width: 70px;
            height: 25px;
            border-radius: 50%;
            background: black;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
            z-index: 5;
        }

        .face1 {
            width: 80px;
            height: 80px;
            background: red;
            border-radius: 50%;
            bottom: 35%;
            left: -5%;
            position: absolute;
        }

        .face2 {
            width: 80px;
            height: 80px;
            background: red;
            border-radius: 50%;
            bottom: 35%;
            right: -5%;
            position: absolute;
        }

        .v1 {
            width: 50px;
            height: 50px;
            background: #fff;
            border: #000;
            position: absolute;
            top: 70%;
            left: 30%;
            transform: skew(45deg);

            z-index: 5;
        }

        .v2 {
            width: 50px;
            height: 50px;
            background: #fff;
            border: #000;
            position: absolute;
            top: 70%;
            right: 30%;
            transform: skew(-45deg);

            z-index: 5;
        }
    </style>




</head>

<body>

    <div class="body">
        <div class="eye-right"></div>
        <div class="eye-left"></div>
        <div class="nose"></div>
        <div class="face1"></div>
        <div class="face2"></div>
        <div class="v1"></div>
        <div class="v2"></div>
    </div>





</body>

</html>
